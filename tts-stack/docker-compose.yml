# NOTE: the compose project name stays `inkcast-tts` on purpose: Docker
# prefixes volumes with it (inkcast-tts_crisp-models holds ~1.3GB of GGUFs
# + the audio cache). Renaming it would orphan that data and force a
# full re-download. Everything else is branded InkTTS.
name: inkcast-tts

services:
  kokoro:
    # CrispASR GGUF kokoro-82m-q8: tiny, CPU, always warm. Replaces the
    # 2GB Kokoro-FastAPI image. Models auto-download into crisp-models.
    build: ./crisp
    image: inktts-crisp:latest
    container_name: inktts-kokoro
    restart: unless-stopped
    command: ["--backend", "kokoro", "-m", "auto",
              "--threads", "10",
              "--gpu-backend", "vulkan",
              "--voice", "/data/.cache/crispasr/kokoro-voice-af_heart.gguf",
              "--voice-dir", "/data/.cache/crispasr",
              "--host", "0.0.0.0", "--port", "8880"]
    ports:
      - "127.0.0.1:8880:8880" # internal only; orchestrator is the LAN front
    volumes:
      - crisp-models:/data
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "39"
      - "105"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8880'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s # first boot downloads ~500MB of GGUFs
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  chatterbox:
    # CrispASR GGUF chatterbox (Turbo-class) on AMD Vulkan: full GPU via
    # FORCE_GPU. Replaces the torch server. Same crisp image as kokoro.
    build: ./crisp
    image: inktts-crisp:latest
    container_name: inktts-chatterbox
    restart: unless-stopped
    command: ["--backend", "chatterbox", "-m", "auto",
              "--voice-dir", "/data/.cache/crispasr",
              "--host", "0.0.0.0", "--port", "8004"]
    environment:
      CRISPASR_CHATTERBOX_FORCE_GPU: "1"
    ports:
      - "127.0.0.1:8004:8004" # internal only
    volumes:
      - crisp-models:/data
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "39"
      - "105"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8004'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s # first boot downloads GGUFs
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  cleaner:
    # Semantic-clean fallback, flagged chapters ONLY (never hot path).
    # Tiny instruct model, loads on demand, idles free.
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: inktts-cleaner
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - cleaner-models:/models
    command: >
      -m /models/qwen2.5-3b-instruct-q4_k_m.gguf
      --ctx-size 4096 --threads 4
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    profiles: ["cleaner"] # opt-in: up only when the LLM fallback is wanted

  orchestrator:
    # Thin routing layer (ours): preempt queue, cache, LRC, SSE, OpenAI shim.
    # Joined in plan Task 4; single LAN-open port (the extension's URL).
    build: ./orchestrator
    image: inktts-orchestrator:latest
    container_name: inktts-orchestrator
    restart: unless-stopped
    ports:
      - "${ORCH_PORT:-8095}:8095"
    environment:
      ORCH_PORT: ${ORCH_PORT:-8095}
      KOKORO_URL: http://kokoro:8880
      CHATTERBOX_URL: http://chatterbox:8004
      CACHE_DIR: /data/cache
      CACHE_CAP_GB: ${CACHE_CAP_GB:-5}
      EVICT_IDLE_MIN: ${EVICT_IDLE_MIN:-10}
    volumes:
      - orch-cache:/data/cache
    depends_on:
      kokoro:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8095/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  crisp-models: # GGUFs + voices: auto-downloaded once, shared by both engines
  cleaner-models:
  orch-cache:
