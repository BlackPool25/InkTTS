name: inkcast-tts

services:
  kokoro:
    # CPU ONNX path: always warm, zero VRAM. Pinned release (no :latest).
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.10.0
    container_name: inkcast-kokoro
    restart: unless-stopped
    ports:
      - "127.0.0.1:8880:8880" # internal only; orchestrator is the LAN front
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8880/docs')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  chatterbox:
    # Turbo default (see upstream config.yaml model.repo_id). Built from
    # source — no prebuilt image exists. GPU lazy: idle-evict handled by
    # orchestrator via /api/unload (evict lease in plan Task 1).
    build:
      context: https://github.com/devnen/Chatterbox-TTS-Server.git#main
      dockerfile: Dockerfile.cu128
      args:
        RUNTIME: nvidia
    image: inkcast-chatterbox:cu128
    container_name: inkcast-chatterbox
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8004" # internal only
    volumes:
      - chatterbox-models:/app/model_cache
      - hf-cache:/app/hf_cache
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8004/')\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s # first boot downloads Turbo weights
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  cleaner:
    # Semantic-clean fallback, flagged chapters ONLY (never hot path).
    # Tiny instruct model, loads on demand, idles free.
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: inkcast-cleaner
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - cleaner-models:/models
    command: >
      -m /models/qwen2.5-3b-instruct-q4_k_m.gguf
      --ctx-size 4096 --threads 4
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    profiles: ["cleaner"] # opt-in: up only when the LLM fallback is wanted

volumes:
  hf-cache: # shared: updates never re-download weights
  chatterbox-models:
  cleaner-models:
