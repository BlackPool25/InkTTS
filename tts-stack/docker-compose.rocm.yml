# AMD ROCm overlay for the 7900 GRE (gfx1100, natively supported — no
# HSA_OVERRIDE needed). Usage:
#   docker compose -f docker-compose.yml -f docker-compose.rocm.yml up -d --build chatterbox
# Everything else (kokoro CPU, orchestrator) is unchanged.
services:
  chatterbox:
    build:
      context: https://github.com/devnen/Chatterbox-TTS-Server.git#main
      dockerfile: Dockerfile.rocm
      args:
        RUNTIME: rocm
    image: inkcast-chatterbox:rocm
    deploy: {} # drop the nvidia reservation
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    ipc: host
    shm_size: 8g
    security_opt:
      - seccomp=unconfined
