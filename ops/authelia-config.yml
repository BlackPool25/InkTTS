# Authelia 4.39. Single-user LAN wall; app trusts this + per-request API_TOKEN.
server:
  address: tcp://:9091/
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth

log:
  level: debug

storage:
  local:
    path: /config/db/storage.sqlite3
  # Key comes from AUTHELIA_STORAGE_ENCRYPTION_KEY env (compose) overriding this placeholder.
  encryption_key: "change-me-set-via-env"

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2

access_control:
  default_policy: deny
  rules:
    - domain:
        - '192.168.29.101'
        - '*.192-168-29-101.nip.io'
      policy: one_factor

# 30-day sessions over plain-http LAN. Authelia 4.39 has no per-cookie
# `secure` key (scheme-derived); http LAN-IP works because the cookie is
# issued without Secure. Domain MUST be non-empty (validator) — an IP works
# for the validator; browsers store it host-only. If a browser ever refuses
# the IP cookie, browse via http://<dash-ip>.nip.io:8085 instead and set
# LAN_HOST to that name (same address, dotted hostname).
session:
  name: inkcast_session
  secret: "change-me-set-via-env"
  expiration: 720h  # 30 days
  inactivity: 24h
  remember_me: 720h  # 30 days
  cookies:
    - domain: '192.168.29.101'
      authelia_url: "https://192.168.29.101:8443"
      default_redirection_url: 'https://192.168.29.101:8085/'
      same_site: lax
    - domain: '192-168-29-101.nip.io'
      authelia_url: "https://auth.192-168-29-101.nip.io:8085"
      default_redirection_url: 'https://inkcast.192-168-29-101.nip.io:8085/'
      same_site: lax

# Brute-force block: 3 strikes -> ban. Single user, no legit retry storms.
regulation:
  max_retries: 3
  find_time: 120s
  ban_time: 300s

identity_validation:
  reset_password:
    jwt_secret: "change-me-set-via-env"

# Filesystem notifier: password-reset mails land here; no SMTP on LAN.
notifier:
  filesystem:
    filename: /config/db/notification.txt
