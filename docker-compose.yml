services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8085:8085"  # App: https://192.168.29.101:8085 (primary) + nip.io fallback
      - "8443:8443"  # Portal: https://192.168.29.101:8443 (primary) + nip.io fallback
      - "8090:8090"  # OpenReader fork (phase 1, stock slim): https://192.168.29.101:8090 + read.* nip.io
      - "8081:8080"  # Typo-catcher: http://<host>:8081 -> https://<host>:8085
      # No :443 listener: plain-LAN install has no domain/cert. Add it only
      # with a real hostname (then also flip Authelia cookie secure=true).
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./frontend/dist:/srv/pwa:ro  # reader UI: Caddy file_server (backend keeps its own copy as fallback)
      - ./ops/lan.crt:/etc/caddy/certs/lan.crt:ro
      - ./ops/lan.key:/etc/caddy/certs/lan.key:ro
    depends_on:
      - backend
      - authelia
      - openreader

  authelia:
    image: authelia/authelia:4.39
    restart: unless-stopped
    volumes:
      - ./ops/authelia-config.yml:/config/configuration.yml:ro
      - ./ops/users_database.yml:/config/users_database.yml:ro
      - authelia_data:/config/db
    environment:
      # File keys are placeholders; these env names map to real config paths (Methods: Environment).
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${AUTHELIA_JWT_SECRET:?set in .env}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET:?set in .env}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY:?set in .env}

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    expose:
      - "8000"  # LAN clients go through Caddy, never direct
    depends_on:
      lncrawl:
        condition: service_started
    volumes:
      - models:/data/models
      - ./frontend/dist:/app/frontend/dist:ro
      - ./data/db:/data/db                 # host-local disk ONLY (WAL breaks on NAS locks)
      - ./data/audio:/data/audio           # may live on NAS
      - ./data/epubs:/data/epubs
      - ./data/backups:/data/backups
      - lncrawl-data:/data/lncrawl:ro  # sidecar writes /data; visible here
      # Backend drives the sidecar via `docker exec` (needs the socket).
      # Blast radius: socket = host-root equivalent. Accepted: single-user box,
      # Authelia wall in front, nothing published past Caddy. Alternative if this
      # ever leaves the home LAN: run the CLI in-process instead.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=2
      - DATABASE_URL=sqlite:////data/db/inkcast.db
      - DATA_DIR=/data
      - LNCRAWL_CONTAINER=inkcast-lncrawl
      - TTS_ENGINE=kokoro
      - TTS_OPUS_BITRATE=32k
      - AUDIO_CACHE_MB=500
      - PREFETCH_AHEAD=1
      - SYNTH_ENABLED=1
      - AUTO_SYNTHESIZE_DEFAULT=0
      - API_TOKEN=${API_TOKEN:?set in .env}  # service-to-service + break-glass CLI
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # lncrawl sidecar: pinned image, idles; backend runs `docker exec` crawl jobs.
  # Volume is mounted at the sidecar's OWN data dir (~/.lncrawl resolved to
  # /root/.lncrawl) — a bare /data mount ingests nothing (4.14.0 ENV LNCRAWL_DATA_PATH=/data — Task 3 verified).
  # Concurrent execs share one browser profile: serialize challenge-solves
  # (max_instances=1 per origin) or use per-job profile dirs.
  lncrawl:
    image: ghcr.io/lncrawl/lightnovel-crawler:4.14.0
    container_name: inkcast-lncrawl
    restart: unless-stopped
    entrypoint: ["sleep", "infinity"]
    volumes:
      - lncrawl-data:/data

  # OpenReader fork phase 1: stock slim build (own Next.js + embedded
  # worker/nats/weed-mini + kokoro-tts sidecar). Single Authelia wall at Caddy;
  # anonymous in-app sessions (USE_ANONYMOUS_AUTH_SESSIONS=true). No ports
  # published — LAN reaches it only via Caddy :8090. Worker audio is same-origin
  # (COMPUTE_WORKER_PUBLIC_URL = Caddy origin; Caddy proxies /v1/* to :8081).
  # Phase 2 bridge (our chapter-JSON novels -> document import API) NOT done.
  openreader:
    build:
      context: ./reader
    restart: unless-stopped
    depends_on:
      kokoro-tts:
        condition: service_started
    environment:
      BASE_URL: https://192.168.29.101:8090
      AUTH_SECRET: ${OPENREADER_AUTH_SECRET:?set in .env}
      USE_ANONYMOUS_AUTH_SESSIONS: "true"
      COMPUTE_WORKER_HOST: 0.0.0.0
      COMPUTE_WORKER_PUBLIC_URL: https://192.168.29.101:8090
      RUNTIME_SEED_JSON: |-
        {
          "version": 1,
          "runtimeConfig": {
            "defaultTtsProvider": "kokoro"
          },
          "providers": [
            {
              "slug": "kokoro",
              "displayName": "Kokoro",
              "providerType": "custom-openai",
              "baseUrl": "http://kokoro-tts:8880/v1",
              "defaultModel": "kokoro",
              "enabled": true
            }
          ]
        }
    volumes:
      - openreader-docstore:/app/docstore

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.4
    restart: unless-stopped
    environment:
      ONNX_NUM_THREADS: 8
      ONNX_INTER_OP_THREADS: 4
      ONNX_EXECUTION_MODE: parallel
      ONNX_OPTIMIZATION_LEVEL: all
      ONNX_MEMORY_PATTERN: "true"
      ONNX_ARENA_EXTEND_STRATEGY: kNextPowerOfTwo
      API_LOG_LEVEL: DEBUG

  # Optional remote access: `docker compose --profile remote up -d`
  # Needs a free Tailscale account (one login, personal plan); no ports opened.
  tailscale:
    image: tailscale/tailscale:v1.86
    profiles: ["remote"]
    restart: unless-stopped
    hostname: inkcast
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_EXTRA_ARGS=--advertise-tags=tag:homelab
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./ops/ts-serve.json:/config/serve.json:ro
    network_mode: service:caddy  # serves Caddy's :80 over the tailnet

volumes:
  caddy_data:
  caddy_config:
  authelia_data:
  lncrawl-data:
  models:
  openreader-docstore:  # OpenReader slim docstore (sqlite + weed-mini + nats jetstream)
